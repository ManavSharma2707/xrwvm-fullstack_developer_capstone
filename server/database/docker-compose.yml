services:
  # Mongodb service
  mongo_db:
    container_name: db_container
    image: mongo:latest
    ports:
      - 27017:27017
    restart: always
    volumes:
      - mongo_data:/data/db

  # Node/Express API service (built from the Dockerfile in this folder)
  api:
    build: .
    image: nodeapp
    ports:
      - 3030:3030
    environment:
      - MONGO_URL=mongodb://mongo_db:27017/
    depends_on:
      - mongo_db

volumes:
  mongo_data: {}
