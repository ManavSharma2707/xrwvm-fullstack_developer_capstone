name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint_python:
    name: Lint Python (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8 on server/
        run: flake8 server

  lint_js:
    name: Lint JavaScript (JSHint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JSHint
        run: npm install --global jshint
      - name: Run JSHint on the Express API
        run: jshint server/database/*.js

  frontend:
    name: Lint and build React app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm ci
      - name: ESLint (react-app config)
        run: npx eslint --max-warnings 0 src
      - name: Build
        run: npm run build
